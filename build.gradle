import java.util.concurrent.TimeUnit

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.12'
}

version = computeModVersion()
group = project.maven_group

tasks.register('printVersion') {
    doLast { println project.version }
}

def computeModVersion() {
    def base = project.mod_version
    def tagPrefix = "v"
    def described = runGitDescribe(tagPrefix)
    if (described == null || described.isEmpty()) {
        return base
    }
    if (described == "${tagPrefix}${base}") {
        return base
    }
    if (described == "${tagPrefix}${base}-dirty") {
        return "${base}+dirty"
    }
    def postTag = described =~ /^\Q${tagPrefix}\E(\S+?)-(\d+)-g([0-9a-f]+)(-dirty)?$/
    if (postTag.matches()) {
        def commits = postTag[0][2]
        def sha = postTag[0][3]
        def dirty = postTag[0][4] ? '.dirty' : ''
        return "${base}+${commits}.g${sha}${dirty}"
    }
    def shaOnly = described =~ /^([0-9a-f]+)(-dirty)?$/
    if (shaOnly.matches()) {
        def sha = shaOnly[0][1]
        def dirty = shaOnly[0][2] ? '.dirty' : ''
        return "${base}+g${sha}${dirty}"
    }
    return base
}

def runGitDescribe(String tagPrefix) {
    try {
        def proc = new ProcessBuilder('git', 'describe', '--tags',
                '--match', "${tagPrefix}*", '--dirty', '--always')
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        def finished = proc.waitFor(10, TimeUnit.SECONDS)
        if (!finished) {
            proc.destroyForcibly()
            return null
        }
        def out = proc.inputStream.text.trim()
        if (proc.exitValue() != 0) return null
        return out
    } catch (Exception ignored) {
        return null
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Bai'
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'lol.bai'
            includeGroup 'mcp.mobius.waila'
        }
    }
    // Concord sibling mods publish their jars only as GitHub release assets — resolve
    // them straight off the release download URL.
    ivy {
        name = 'GitHubReleases'
        url = 'https://github.com'
        patternLayout {
            artifact '[organisation]/[module]/releases/download/v[revision]/[module]-[revision].jar'
        }
        metadataSources { artifact() }
        content {
            includeGroup 'rfizzle'
        }
    }
}

sourceSets {
    main {
        resources {
            // Datagen output (mc-datagen "Output directory"): ships in the jar and lands on the
            // test classpath exactly like src/main/resources.
            srcDirs += [ "src/main/generated" ]
        }
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

loom {
    splitEnvironmentSourceSets()

    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=mercantile"
            runDir "build/datagen"
        }
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('junit-gametest.xml').get().asFile}"
            runDir "build/gametest"
        }
    }
}

// Expose client source set classes to JUnit tests (output only — no transitive deps).
// Lets pure-math helpers on client-only classes be tested without enabling fabric-api at test runtime.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    "clientImplementation"("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    modCompileOnly "maven.modrinth:jade:${project.jade_version}"
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"

    modCompileOnly "mcp.mobius.waila:wthit-api:${project.wthit_version}"

    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    "modClientCompileOnly"("dev.emi:emi-fabric:${project.emi_version}:api")
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    "modClientCompileOnly"("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
    "modClientCompileOnly"("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}")
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modLocalRuntime "dev.architectury:architectury-fabric:${project.architectury_version}"

    modCompileOnly "rfizzle:tribulation:${project.tribulation_version}"

    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
    "modClientCompileOnly"("mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}")
    modLocalRuntime "mezz.jei:jei-1.21.1-fabric:${project.jei_version}"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

configurations.testRuntimeClasspath {
    exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    // GametestRegistrationTest reads the gametest sources and manifest off disk to assert every
    // suite is registered. Neither is on the test classpath, so declare them as inputs or the
    // task stays UP-TO-DATE and the check silently skips when registration drifts.
    inputs.files(fileTree('src/gametest/java'), file('src/gametest/resources/fabric.mod.json'))
            .withPropertyName('gametestRegistration')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // JeiDiscoveryTest reads the JEI plugin source off disk to assert it still carries
    // @JeiPlugin for cross-loader parity. Compiled client classes are on the test classpath but
    // the source is not, so without this the task stays UP-TO-DATE when the annotation is dropped.
    inputs.files(file('src/client/java/com/rfizzle/mercantile/compat/jei/MercantileJeiPlugin.java'))
            .withPropertyName('jeiPluginDiscovery')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Attach the JaCoCo agent to the gametest server so code only exercised in-game
// (event handlers, trade logic, commands, registration) counts toward coverage. The
// includes filter keeps the agent from instrumenting Minecraft/Fabric classes.
tasks.named('runGametest') {
    jacoco.applyTo(it)
    it.jacoco.destinationFile = layout.buildDirectory.file('jacoco/runGametest.exec').get().asFile
    it.jacoco.includes = ['com.rfizzle.mercantile.*']
    // The agent's exec file is an @OutputFile, which would otherwise make this
    // JavaExec up-to-date-checkable and silently skip the whole in-world suite on
    // a repeat run — re-emitting the previous coverage number as if it were fresh.
    // A gametest sweep must always execute.
    it.outputs.upToDateWhen { false }
}

// Single source of coverage truth: unit tests + gametests merged over src/main.
// fileTree only picks up exec files that exist, so the report still runs when
// one of the two sweeps hasn't.
tasks.register('jacocoMergedReport', JacocoReport) {
    // The report reads compileJava/processResources output, so it must depend on them —
    // without this, any invocation that compiles without also scheduling a test task
    // (e.g. `gradlew jar jacocoMergedReport`) fails Gradle's implicit-dependency validation.
    dependsOn tasks.named('classes')
    // Ordering only — not dependsOn, so the report can run from existing exec
    // data without forcing a gametest server spin-up.
    mustRunAfter test, tasks.named('runGametest')
    // A sweep that never ran leaves its exec file absent, and one that was interrupted
    // leaves it empty — Gradle deletes the file before the run and the agent only dumps
    // at JVM exit. A sweep that ran before the last recompile is worse: JaCoCo matches
    // execution data by class ID, so a stale exec contributes nothing and its classes
    // read 0% rather than failing. Every one of those is a partial number under the
    // "merged" label with no indication, so say so.
    doFirst {
        def newestClass = classDirectories.asFileTree.files*.lastModified().max() ?: 0L
        ['test.exec', 'runGametest.exec'].each { name ->
            def execFile = layout.buildDirectory.file("jacoco/${name}").get().asFile
            if (!execFile.exists() || execFile.length() == 0) {
                logger.warn("jacocoMergedReport: ${name} is missing or empty — this report is NOT merged coverage. Run: make coverage")
            } else if (execFile.lastModified() < newestClass) {
                logger.warn("jacocoMergedReport: ${name} predates the compiled classes — anything recompiled " +
                        'since that sweep reads 0%; re-run `make coverage`')
            }
        }
    }
    executionData fileTree(layout.buildDirectory.dir('jacoco')) {
        include 'test.exec', 'runGametest.exec'
    }
    sourceSets sourceSets.main
    // Mixin bodies execute inside the transformed vanilla classes, so the agent
    // can never attribute coverage to the mixin class files — excluding them keeps
    // the denominator honest. Mixins stay thin (delegate to handlers) so nothing
    // measurable hides here. Kept lazy: resolving classDirectories eagerly would
    // drop the implicit dependency on `classes` and let the report run against
    // class dirs that do not exist yet.
    classDirectories.setFrom(files(sourceSets.main.output).asFileTree.matching {
        exclude 'com/rfizzle/mercantile/mixin/**'
    })
    reports {
        xml.required = true
        html.required = true
    }
}

// Fabric datagen keeps a gitignored hash cache under src/main/generated/.cache and skips
// rewriting any file whose provider hash is unchanged — so a hand edit to a generated file
// survives runDatagen and verifyDatagenIdempotent would compare the edit to itself. Clear it
// first (mc-datagen "Idempotency verification").
tasks.register('cleanDatagenCache', Delete) {
    description = 'Removes the Fabric datagen hash cache so the next runDatagen rewrites every file'
    group = 'verification'
    delete 'src/main/generated/.cache'
}

tasks.matching { it.name == 'runDatagen' }.configureEach {
    mustRunAfter 'cleanDatagenCache'
}

tasks.register('verifyDatagenIdempotent') {
    description = 'Runs datagen and asserts git reports no changes in src/main/generated/'
    group = 'verification'
    dependsOn 'cleanDatagenCache', 'runDatagen'
    // The check shells out to git against live working-tree state, which Gradle cannot model as
    // task inputs. Declaring the incompatibility keeps the intent explicit rather than leaving a
    // hard failure for whoever enables the configuration cache.
    notCompatibleWithConfigurationCache('shells out to git against live working-tree state')
    doLast {
        def genDir = file('src/main/generated').absolutePath
        // Fail with an actionable message when git itself cannot run. ignoreExitValue covers a
        // nonzero exit, not a process that never starts, so an absent binary would otherwise
        // surface as a bare process-start exception naming neither datagen nor a remedy.
        def runGit = { List<String> argv ->
            try {
                def out = providers.exec {
                    commandLine argv
                    ignoreExitValue = true
                }
                out.result.get() // force resolution so a failure to start lands in the catch
                return out
            } catch (Exception e) {
                throw new GradleException(
                        'verifyDatagenIdempotent needs git on PATH to inspect ' +
                        'src/main/generated/, and could not run it: ' + e.message, e)
            }
        }
        // Keep both git outputs readable, and say so when truncating.
        def firstLines = { String text ->
            def lines = text.trim().readLines()
            lines.size() > 5 ? lines.take(5).join('\n') + "\n… (${lines.size()} lines total)"
                             : lines.join('\n')
        }

        // Pin the check against a tree git actually knows about before trusting a clean
        // answer. `git status --porcelain -- <path>` exits 0 with empty output for a path
        // that does not exist or holds nothing tracked, so a datagen entrypoint that
        // stopped running, a typo'd output-dir vmArg, or a bad merge would leave this task
        // reporting green while verifying nothing at all.
        def listedResult = runGit(['git', '--no-optional-locks', 'ls-files', '--', genDir])
        def listedExit = listedResult.result.get().exitValue
        if (listedExit != 0) {
            throw new GradleException(
                    "git ls-files failed with exit ${listedExit} while checking src/main/generated/:\n" +
                    firstLines(listedResult.standardError.asText.get()))
        }
        def tracked = listedResult.standardOutput.asText.get().trim()
        if (tracked.isEmpty()) {
            throw new GradleException(
                    'verifyDatagenIdempotent found no tracked files under src/main/generated/, so a ' +
                    'clean git status there would prove nothing. Either datagen produced no output ' +
                    '(check the DataGeneratorEntrypoint and the datagen run config\'s output-dir vmArg) ' +
                    'or the generated tree was never committed.')
        }

        // --no-optional-locks keeps a read-only check from taking .git/index.lock: git status
        // rewrites the index when cached stat info is stale, which is exactly the state runDatagen
        // leaves behind after rewriting every generated file. The '--' separator keeps git from
        // parsing the path as a revision.
        def statusResult = runGit(['git', '--no-optional-locks', 'status', '--porcelain', '--', genDir])
        def statusExit = statusResult.result.get().exitValue
        if (statusExit != 0) {
            throw new GradleException(
                    "git status failed with exit ${statusExit} while checking src/main/generated/:\n" +
                    firstLines(statusResult.standardError.asText.get()))
        }
        def dirty = statusResult.standardOutput.asText.get().trim()
        if (!dirty.isEmpty()) {
            throw new GradleException(
                    'src/main/generated/ is not clean after runDatagen:\n' +
                    firstLines(dirty) +
                    '\nRun ./gradlew runDatagen, then git add src/main/generated/ ' +
                    'and commit the results ' +
                    '(staged-but-uncommitted output also fails this check).')
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version.toInteger()
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
